<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Echo — Вход</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="auth-container" id="app">
        <h1>🔊 Echo</h1>
        <div class="tabs">
            <button class="tab active" data-tab="login" type="button">Вход</button>
            <button class="tab" data-tab="register" type="button">Регистрация</button>
        </div>

        <form id="login-form" class="auth-form active" autocomplete="off">
            <input type="text" id="login-username" placeholder="Имя пользователя" required />
            <input type="password" id="login-password" placeholder="Пароль" required />
            <button type="submit" id="login-btn">Войти</button>
            <p id="login-error" class="error"></p>
        </form>

        <form id="register-form" class="auth-form" autocomplete="off">
            <input type="text" id="reg-username" placeholder="Имя пользователя" required />
            <input type="password" id="reg-password" placeholder="Пароль" required />
            <input type="text" id="reg-displayname" placeholder="Отображаемое имя" required />
            <button type="submit" id="register-btn">Зарегистрироваться</button>
            <p id="reg-error" class="error"></p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
