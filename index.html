<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Echo — Мессенджер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background: #f0f2f5;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        #auth-page {
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
            display: block;
        }
        
        #auth-page h1 {
            text-align: center;
            font-size: 2rem;
            color: #1a2332;
            margin-bottom: 20px;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #e8ecf1;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .tab-btn.active {
            background: #1a2332;
            color: white;
        }
        
        .tab-btn:active {
            transform: scale(0.95);
        }
        
        .form {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        
        .form.active {
            display: flex;
        }
        
        .form input {
            padding: 14px 16px;
            border: 2px solid #dce1e8;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            width: 100%;
            -webkit-appearance: none;
            background: white;
        }
        
        .form input:focus {
            border-color: #1a2332;
        }
        
        .form button {
            padding: 14px;
            background: #1a2332;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        
        .form button:active {
            transform: scale(0.95);
            background: #0d1420;
        }
        
        .error {
            color: #e74c3c;
            font-size: 14px;
            text-align: center;
            min-height: 20px;
        }
        
        .success-msg {
            color: #27ae60;
            text-align: center;
            font-size: 14px;
        }
        
        #messenger-page {
            display: none;
            width: 100%;
            max-width: 1200px;
            height: 92vh;
            height: 92dvh;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        
        .messenger-layout {
            display: flex;
            height: 100%;
            flex-direction: row;
        }
        
        .sidebar {
            width: 300px;
            min-width: 200px;
            background: #f8faff;
            border-right: 1px solid #e8ecf3;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 16px;
            border-bottom: 1px solid #e8ecf3;
        }
        
        .sidebar-header h2 {
            color: #1a2332;
            font-size: 1.2rem;
        }
        
        .sidebar-header .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .sidebar-header .actions a {
            text-decoration: none;
            font-size: 1.3rem;
            color: #1a2332;
            padding: 5px 8px;
            -webkit-tap-highlight-color: transparent;
        }
        
        .sidebar-header .actions button {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px 8px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .search-box {
            padding: 10px 16px;
            border-bottom: 1px solid #e8ecf3;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #dce1e8;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .search-box input:focus {
            border-color: #1a2332;
        }
        
        .user-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px 0;
            -webkit-overflow-scrolling: touch;
        }
        
        .user-item {
            padding: 12px 16px;
            cursor: pointer;
            border-left: 4px solid transparent;
            display: flex;
            justify-content: space-between;
            align-items: center;
            touch-action: manipulation;
            transition: 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        
        .user-item:active {
            background: #e3eaf3;
        }
        
        .user-item.active {
            background: #e3eaf3;
            border-left-color: #1a2332;
        }
        
        .user-item .name {
            font-weight: 600;
            color: #1a2332;
        }
        
        .user-item .username {
            font-size: 12px;
            color: #8896a8;
        }
        
        .user-item .online {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2ecc71;
            flex-shrink: 0;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e8ecf3;
            font-weight: 600;
            color: #1a2332;
            background: #fafcff;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fafcff;
            -webkit-overflow-scrolling: touch;
        }
        
        .msg {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            background: #e8ecf1;
            word-break: break-word;
        }
        
        .msg.self {
            align-self: flex-end;
            background: #1a2332;
            color: white;
        }
        
        .msg .sender {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.6;
            margin-right: 6px;
        }
        
        .msg .time {
            font-size: 10px;
            opacity: 0.4;
            margin-left: 6px;
        }
        
        .msg-input {
            display: flex;
            padding: 10px 16px;
            border-top: 1px solid #e8ecf3;
            gap: 8px;
            background: white;
        }
        
        .msg-input input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #dce1e8;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .msg-input input:focus {
            border-color: #1a2332;
        }
        
        .msg-input button {
            padding: 10px 18px;
            background: #1a2332;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 50px;
            -webkit-tap-highlight-color: transparent;
        }
        
        .msg-input button:active {
            transform: scale(0.9);
        }
        
        .empty-state {
            text-align: center;
            color: #8896a8;
            margin-top: 30px;
            font-size: 15px;
        }
        
        #profile-page {
            display: none;
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        #profile-page h1 {
            margin-bottom: 20px;
            color: #1a2332;
        }
        
        .profile-card {
            background: #f8faff;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        
        .profile-card p {
            margin: 8px 0;
        }
        
        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 15px 0;
        }
        
        .settings-group select {
            padding: 12px;
            border-radius: 30px;
            border: 2px solid #dce1e8;
            font-size: 16px;
            width: 100%;
            -webkit-appearance: none;
        }
        
        .settings-group button {
            padding: 14px;
            background: #1a2332;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .settings-group button:active {
            transform: scale(0.95);
        }
        
        .back-btn {
            padding: 12px;
            background: #e8ecf1;
            color: #1a2332;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .back-btn:active {
            transform: scale(0.95);
        }
        
        body.dark #auth-page,
        body.dark #profile-page,
        body.dark #messenger-page {
            background: #1e2633;
            color: #eef2f7;
        }
        
        body.dark .sidebar {
            background: #181f2b;
            border-color: #2a3342;
        }
        
        body.dark .sidebar-header,
        body.dark .search-box {
            border-color: #2a3342;
        }
        
        body.dark .sidebar-header h2 {
            color: #eef2f7;
        }
        
        body.dark .user-item:active {
            background: #2a3342;
        }
        
        body.dark .user-item.active {
            background: #2a3342;
        }
        
        body.dark .user-item .name {
            color: #eef2f7;
        }
        
        body.dark .chat-header,
        body.dark .chat-messages {
            background: #181f2b;
            border-color: #2a3342;
        }
        
        body.dark .msg {
            background: #2a3342;
            color: #eef2f7;
        }
        
        body.dark .msg.self {
            background: #3d4a62;
        }
        
        body.dark .msg-input {
            background: #181f2b;
            border-color: #2a3342;
        }
        
        body.dark .msg-input input {
            background: #1e2633;
            color: #eef2f7;
            border-color: #3a4558;
        }
        
        body.dark .profile-card {
            background: #181f2b;
        }
        
        body.dark .settings-group select {
            background: #1e2633;
            color: #eef2f7;
            border-color: #3a4558;
        }
        
        body.dark .back-btn {
            background: #2a3342;
            color: #eef2f7;
        }
        
        body.dark .tab-btn {
            background: #2a3342;
            color: #eef2f7;
        }
        
        body.dark .tab-btn.active {
            background: #3d4a62;
        }
        
        body.dark .form input {
            background: #1e2633;
            color: #eef2f7;
            border-color: #3a4558;
        }
        
        body.dark .form input:focus {
            border-color: #5a6a82;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 0;
            }
            
            #auth-page {
                border-radius: 0;
                height: 100vh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                max-width: 100%;
                padding: 30px 20px;
            }
            
            #messenger-page {
                border-radius: 0;
                height: 100vh;
                height: 100dvh;
                max-width: 100%;
            }
            
            .messenger-layout {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 40%;
                border-right: none;
                border-bottom: 1px solid #e8ecf3;
                min-width: unset;
            }
            
            .chat-area {
                height: 60%;
            }
            
            #profile-page {
                border-radius: 0;
                height: 100vh;
                height: 100dvh;
                max-width: 100%;
                padding: 30px 20px;
            }
        }
        
        @media (max-width: 480px) {
            .sidebar-header h2 {
                font-size: 1rem;
            }
            
            .user-item {
                padding: 10px 12px;
            }
            
            .chat-header {
                padding: 10px 14px;
                font-size: 14px;
            }
            
            .chat-messages {
                padding: 10px 14px;
            }
            
            .msg-input {
                padding: 8px 12px;
            }
            
            .msg {
                max-width: 85%;
                padding: 8px 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

<div id="auth-page">
    <h1>🔊 Echo</h1>
    
    <div class="tabs">
        <button class="tab-btn active" id="tab-login">Вход</button>
        <button class="tab-btn" id="tab-register">Регистрация</button>
    </div>
    
    <div class="form active" id="login-form">
        <input type="text" id="login-username" placeholder="Имя пользователя" />
        <input type="password" id="login-password" placeholder="Пароль" />
        <button id="login-btn">Войти</button>
        <div class="error" id="login-error"></div>
    </div>
    
    <div class="form" id="register-form">
        <input type="text" id="reg-username" placeholder="Имя пользователя" />
        <input type="password" id="reg-password" placeholder="Пароль" />
        <input type="text" id="reg-displayname" placeholder="Отображаемое имя" />
        <button id="register-btn">Зарегистрироваться</button>
        <div class="error" id="reg-error"></div>
    </div>
</div>

<div id="messenger-page">
    <div class="messenger-layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🔊 Echo</h2>
                <div class="actions">
                    <a href="#" id="profile-link">⚙️</a>
                    <button id="logout-btn">🚪</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="search-users" placeholder="🔍 Найти пользователя..." />
            </div>
            <div class="user-list" id="user-list"></div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="chat-header">👈 Выберите собеседника</div>
            <div class="chat-messages" id="chat-messages">
                <div class="empty-state">Выберите пользователя для начала чата</div>
            </div>
            <div class="msg-input">
                <input type="text" id="message-text" placeholder="Введите сообщение..." />
                <button id="send-btn">📨</button>
            </div>
        </div>
    </div>
</div>

<div id="profile-page">
    <h1>👤 Мой профиль</h1>
    <div class="profile-card">
        <p><strong>Имя пользователя:</strong> <span id="profile-username"></span></p>
        <p><strong>Отображаемое имя:</strong> <span id="profile-displayname"></span></p>
    </div>
    <h2>⚙️ Настройки</h2>
    <div class="settings-group">
        <label>Тема:
            <select id="theme-select">
                <option value="light">Светлая</option>
                <option value="dark">Тёмная</option>
            </select>
        </label>
        <label>Язык:
            <select id="lang-select">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
        </label>
        <button id="save-settings">💾 Сохранить настройки</button>
        <div class="success-msg" id="settings-status"></div>
    </div>
    <button class="back-btn" id="back-btn">← Назад в чат</button>
</div>

<script>
// ================================================================
// ХРАНИЛИЩЕ
// ================================================================
const DB_KEY = 'echo_users';
const SESSION_KEY = 'echo_session';
const MESSAGES_KEY = 'echo_messages';

function getUsers() {
    try {
        return JSON.parse(localStorage.getItem(DB_KEY)) || [];
    } catch {
        return [];
    }
}

function setUsers(users) {
    localStorage.setItem(DB_KEY, JSON.stringify(users));
}

function getSession() {
    try {
        return JSON.parse(localStorage.getItem(SESSION_KEY));
    } catch {
        return null;
    }
}

function setSession(user) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(user));
}

function clearSession() {
    localStorage.removeItem(SESSION_KEY);
}

function getMessages() {
    try {
        return JSON.parse(localStorage.getItem(MESSAGES_KEY)) || {};
    } catch {
        return {};
    }
}

function setMessages(messages) {
    localStorage.setItem(MESSAGES_KEY, JSON.stringify(messages));
}

// ================================================================
// ПОКАЗ СТРАНИЦ
// ================================================================
function showPage(page) {
    document.getElementById('auth-page').style.display = 'none';
    document.getElementById('messenger-page').style.display = 'none';
    document.getElementById('profile-page').style.display = 'none';
    
    if (page === 'auth') {
        document.getElementById('auth-page').style.display = 'block';
    } else if (page === 'messenger') {
        document.getElementById('messenger-page').style.display = 'block';
    } else if (page === 'profile') {
        document.getElementById('profile-page').style.display = 'block';
    }
}

// ================================================================
// ПРИМЕНЕНИЕ ТЕМЫ
// ================================================================
function applyTheme(theme) {
    if (theme === 'dark') {
        document.body.classList.add('dark');
    } else {
        document.body.classList.remove('dark');
    }
}

// ================================================================
// СОЗДАНИЕ ТЕСТОВЫХ ПОЛЬЗОВАТЕЛЕЙ (ЕСЛИ ИХ НЕТ)
// ================================================================
function createTestUsers() {
    const users = getUsers();
    
    // Если пользователей меньше 3, добавляем тестовых
    if (users.length < 3) {
        const testUsers = [
            { username: 'alex', password: '123', displayname: 'Алексей', theme: 'light', lang: 'ru' },
            { username: 'maria', password: '123', displayname: 'Мария', theme: 'light', lang: 'ru' },
            { username: 'dmitry', password: '123', displayname: 'Дмитрий', theme: 'light', lang: 'ru' },
            { username: 'elena', password: '123', displayname: 'Елена', theme: 'light', lang: 'ru' },
            { username: 'ivan', password: '123', displayname: 'Иван', theme: 'light', lang: 'ru' }
        ];
        
        // Добавляем только тех, кого нет
        testUsers.forEach(testUser => {
            if (!users.find(u => u.username === testUser.username)) {
                users.push(testUser);
            }
        });
        
        setUsers(users);
        console.log('✅ Добавлены тестовые пользователи:', users.map(u => u.username).join(', '));
    }
}

// ================================================================
// ГЛАВНЫЙ ЗАПУСК
// ================================================================
let currentChat = null;
let allUsers = [];
let filteredUsers = [];
let session = null;
let messengerInitialized = false;

// ================================================================
// АВТОРИЗАЦИЯ
// ================================================================
function initAuth() {
    console.log('🔐 Инициализация авторизации');
    
    // Переключение табов
    document.getElementById('tab-login').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
        document.getElementById('login-form').classList.add('active');
        document.getElementById('register-form').classList.remove('active');
        document.getElementById('login-error').textContent = '';
        document.getElementById('reg-error').textContent = '';
    });
    
    document.getElementById('tab-register').addEventListener('click', function(e) {
        e.preventDefault();
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('register-form').classList.add('active');
        document.getElementById('login-form').classList.remove('active');
        document.getElementById('login-error').textContent = '';
        document.getElementById('reg-error').textContent = '';
    });
    
    // ===== РЕГИСТРАЦИЯ =====
    document.getElementById('register-btn').addEventListener('click', function(e) {
        e.preventDefault();
        console.log('📝 Регистрация');
        
        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const displayname = document.getElementById('reg-displayname').value.trim() || username;
        const errorEl = document.getElementById('reg-error');
        
        if (!username || !password) {
            errorEl.textContent = '❌ Заполните все поля!';
            return;
        }
        
        const users = getUsers();
        if (users.find(u => u.username === username)) {
            errorEl.textContent = '❌ Пользователь уже существует!';
            return;
        }
        
        users.push({ 
            username, 
            password, 
            displayname, 
            theme: 'light', 
            lang: 'ru'
        });
        setUsers(users);
        errorEl.textContent = '';
        alert('✅ Регистрация успешна! Теперь войдите.');
        
        document.getElementById('reg-username').value = '';
        document.getElementById('reg-password').value = '';
        document.getElementById('reg-displayname').value = '';
        
        // Переключаем на вход
        document.getElementById('tab-login').click();
    });
    
    // ===== ВХОД =====
    document.getElementById('login-btn').addEventListener('click', function(e) {
        e.preventDefault();
        console.log('🔑 Вход');
        
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const errorEl = document.getElementById('login-error');
        
        if (!username || !password) {
            errorEl.textContent = '❌ Введите имя и пароль!';
            return;
        }
        
        const users = getUsers();
        const user = users.find(u => u.username === username && u.password === password);
        
        if (!user) {
            errorEl.textContent = '❌ Неверное имя или пароль!';
            return;
        }
        
        errorEl.textContent = '';
        setSession({ username: user.username, displayname: user.displayname });
        applyTheme(user.theme || 'light');
        showPage('messenger');
        initMessenger();
    });
    
    // Enter на полях
    document.getElementById('login-username').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
    document.getElementById('login-password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('login-btn').click();
    });
    document.getElementById('reg-username').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('register-btn').click();
    });
    document.getElementById('reg-password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('register-btn').click();
    });
    document.getElementById('reg-displayname').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('register-btn').click();
    });
}

function initMessenger() {
    if (messengerInitialized) return;
    messengerInitialized = true;
    
    console.log('💬 Инициализация мессенджера');
    session = getSession();
    if (!session) return;
    
    // Загружаем пользователей и создаём тестовых
    createTestUsers();
    loadUsers();
    setupMessengerEvents();
    renderMessages();
}

function loadUsers() {
    allUsers = getUsers();
    filteredUsers = [...allUsers];
    renderUserList();
}

function renderUserList() {
    const list = document.getElementById('user-list');
    if (!list) return;
    
    list.innerHTML = '';
    
    // Показываем всех, кроме текущего пользователя
    const available = filteredUsers.filter(u => u.username !== session.username);
    
    console.log('👥 Доступно пользователей:', available.length);
    console.log('👤 Текущий пользователь:', session.username);
    
    if (available.length === 0) {
        list.innerHTML = `<div style="padding:30px 16px;text-align:center;color:#8896a8;">
            🤝 Пока нет других пользователей<br>
            <span style="font-size:12px;">Зарегистрируйте нового пользователя</span>
        </div>`;
        return;
    }
    
    available.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item' + (currentChat === u.username ? ' active' : '');
        div.innerHTML = `
            <div>
                <div class="name">${u.displayname || u.username}</div>
                <div class="username">@${u.username}</div>
            </div>
            <span class="online"></span>
        `;
        
        div.addEventListener('click', function(e) {
            e.preventDefault();
            console.log('👤 Выбран пользователь:', u.username);
            currentChat = u.username;
            renderUserList();
            renderMessages();
            document.getElementById('chat-header').textContent = `💬 ${u.displayname || u.username} (@${u.username})`;
        });
        
        list.appendChild(div);
    });
}

function renderMessages() {
    const container = document.getElementById('chat-messages');
    if (!container) return;
    
    container.innerHTML = '';
    
    if (!currentChat) {
        container.innerHTML = '<div class="empty-state">👈 Выберите собеседника</div>';
        return;
    }
    
    const all = getMessages();
    const chatKey = [session.username, currentChat].sort().join('_');
    const msgs = all[chatKey] || [];
    
    if (msgs.length === 0) {
        container.innerHTML = '<div class="empty-state">💬 Напишите первое сообщение!</div>';
        return;
    }
    
    msgs.forEach(msg => {
        const div = document.createElement('div');
        div.className = 'msg' + (msg.from === session.username ? ' self' : '');
        
        const sender = msg.from === session.username ? 'Вы' : 
            (allUsers.find(u => u.username === msg.from)?.displayname || msg.from);
        
        const time = new Date(msg.timestamp).toLocaleTimeString('ru-RU', {
            hour: '2-digit',
            minute: '2-digit'
        });
        
        div.innerHTML = `<span class="sender">${sender}</span> ${msg.text} <span class="time">${time}</span>`;
        container.appendChild(div);
    });
    
    container.scrollTop = container.scrollHeight;
}

let replyTimeout = null;

function sendMessage() {
    const input = document.getElementById('message-text');
    if (!input) return;
    
    const text = input.value.trim();
    if (!text) {
        console.log('⚠️ Пустое сообщение');
        return;
    }
    
    if (!currentChat) {
        const header = document.getElementById('chat-header');
        header.textContent = '⚠️ Выберите собеседника!';
        header.style.color = '#e74c3c';
        setTimeout(() => {
            header.textContent = '👈 Выберите собеседника';
            header.style.color = '';
        }, 1500);
        return;
    }
    
    console.log('📨 Отправка сообщения:', text);
    
    const all = getMessages();
    const chatKey = [session.username, currentChat].sort().join('_');
    if (!all[chatKey]) all[chatKey] = [];
    
    all[chatKey].push({
        from: session.username,
        text: text,
        timestamp: Date.now()
    });
    
    setMessages(all);
    input.value = '';
    renderMessages();
    
    // Автоответ
    if (replyTimeout) clearTimeout(replyTimeout);
    replyTimeout = setTimeout(() => {
        if (!currentChat) return;
        const all2 = getMessages();
        const key2 = [session.username, currentChat].sort().join('_');
        if (!all2[key2]) all2[key2] = [];
        
        const last = all2[key2][all2[key2].length - 1];
        if (last && last.from === session.username) {
            const replies = ['Привет! 👋', 'Как дела?', 'Ок', '👍', 'Спасибо!', 'Да, конечно', 'Понял', 'Отлично! 😊'];
            all2[key2].push({
                from: currentChat,
                text: replies[Math.floor(Math.random() * replies.length)],
                timestamp: Date.now()
            });
            setMessages(all2);
            renderMessages();
        }
    }, 1200 + Math.random() * 1500);
}

function setupMessengerEvents() {
    console.log('🔧 Настройка событий мессенджера');
    
    // Поиск
    document.getElementById('search-users').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase().trim();
        if (query === '') {
            filteredUsers = [...allUsers];
        } else {
            filteredUsers = allUsers.filter(u =>
                u.username.toLowerCase().includes(query) ||
                (u.displayname && u.displayname.toLowerCase().includes(query))
            );
        }
        renderUserList();
    });
    
    // Отправка сообщения
    document.getElementById('send-btn').addEventListener('click', function(e) {
        e.preventDefault();
        sendMessage();
    });
    
    document.getElementById('message-text').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }
    });
    
    // Выход
    document.getElementById('logout-btn').addEventListener('click', function(e) {
        e.preventDefault();
        console.log('🚪 Выход');
        clearSession();
        messengerInitialized = false;
        showPage('auth');
        initAuth();
    });
    
    // Профиль
    document.getElementById('profile-link').addEventListener('click', function(e) {
        e.preventDefault();
        console.log('⚙️ Открытие профиля');
        showPage('profile');
        loadProfile();
    });
}

// ================================================================
function loadProfile() {
    const session = getSession();
    if (!session) return;
    
    const users = getUsers();
    const user = users.find(u => u.username === session.username);
    
    if (user) {
        document.getElementById('profile-username').textContent = user.username;
        document.getElementById('profile-displayname').textContent = user.displayname || user.username;
        document.getElementById('theme-select').value = user.theme || 'light';
        document.getElementById('lang-select').value = user.lang || 'ru';
    }
    
    document.getElementById('save-settings').addEventListener('click', function(e) {
        e.preventDefault();
        const theme = document.getElementById('theme-select').value;
        const lang = document.getElementById('lang-select').value;
        const users = getUsers();
        const idx = users.findIndex(u => u.username === session.username);
        
        if (idx !== -1) {
            users[idx].theme = theme;
            users[idx].lang = lang;
            setUsers(users);
            applyTheme(theme);
            document.getElementById('settings-status').textContent = '✅ Настройки сохранены!';
            setTimeout(() => {
                document.getElementById('settings-status').textContent = '';
            }, 3000);
        }
    });
    
    document.getElementById('back-btn').addEventListener('click', function(e) {
        e.preventDefault();
        showPage('messenger');
        loadUsers();
        renderMessages();
    });
}
